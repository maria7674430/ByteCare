<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Registro de Serviço - ByteCare</title>
</head>
<body>

    <h1>Registro de Serviço</h1>

    <form>
        <label>Equipamento:</label>
        <input type="text">

        <br><br>

        <label>Problema:</label>
        <input type="text">

        <br><br>

        <label>Descrição do serviço:</label>
        <input type="text">

        <br><br>

        <label>Data de entrada:</label>
        <input type="date">

        <br><br>

        <label>Status:</label>
        <input type="text">

        <br><br>

        <label>Valor:</label>
        <input type="number">

        <br><br>

        <button type="submit">Salvar</button>
        <button type="button">Voltar</button>
    </form>

</body>
</html>
