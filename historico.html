<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Consulta e Histórico - ByteCare</title>
</head>
<body>

    <h1>Consulta e Histórico de Serviços</h1>

    <button type="button" onclick="consultarServicos()">Consultar serviços</button>
    <button type="button" onclick="history.back()">Voltar</button>

    <br><br>

    <div id="resultado"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        async function consultarServicos() {

            const { data, error } = await supabaseClient
                .from("servicos")
                .select("*");

            if (error) {
                document.getElementById("resultado").innerHTML =
                    "Erro ao consultar serviços: " + error.message;
                return;
            }

            if (data.length === 0) {
                document.getElementById("resultado").innerHTML =
                    "Nenhum serviço cadastrado.";
                return;
            }

            let tabela = "<table border='1' cellpadding='8'>";
            tabela += "<tr>";
            tabela += "<th>ID</th>";
            tabela += "<th>Descrição</th>";
            tabela += "<th>Data</th>";
            tabela += "<th>Status</th>";
            tabela += "<th>Valor</th>";
            tabela += "</tr>";

            data.forEach(servico => {
                tabela += "<tr>";
                tabela += "<td>" + servico.id_servico + "</td>";
                tabela += "<td>" + servico.descricao_servico + "</td>";
                tabela += "<td>" + servico.data_entrada + "</td>";
                tabela += "<td>" + servico.status + "</td>";
                tabela += "<td>R$ " + servico.valor + "</td>";
                tabela += "</tr>";
            });

            tabela += "</table>";

            document.getElementById("resultado").innerHTML = tabela;
        }
    </script>

</body>
</html>
