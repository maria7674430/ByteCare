<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Consulta e Histórico - ByteCare</title>
</head>
<body>

    <h1>Consulta e Histórico de Serviços</h1>

    <form>
        <label>Cliente:</label>
        <input type="text">

        <br><br>

        <label>Equipamento:</label>
        <input type="text">

        <br><br>

        <label>Problema:</label>
        <input type="text">

        <br><br>

        <label>Serviço realizado:</label>
        <input type="text">

        <br><br>

        <label>Data:</label>
        <input type="date">

        <br><br>

        <label>Status:</label>
        <input type="text">

        <br><br>

        <label>Valor:</label>
        <input type="number">

        <br><br>

        <button type="submit">Consultar</button>
        <button type="button">Voltar</button>
    </form>

</body>
</html>
